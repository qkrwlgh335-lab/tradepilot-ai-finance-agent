name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install development dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Run fixed evaluation
        run: npm run eval

      - name: Scan repository text for key-like values
        run: npm run security:scan
