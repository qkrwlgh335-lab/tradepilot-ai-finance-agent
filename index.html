<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KB TradePilot — 수출입 금융 지원 에이전트</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand-row">
        <h1>KB TradePilot</h1>
        <span class="demo-badge">예시 데이터 데모</span>
      </div>
      <p class="tagline">수출·수입 중소기업을 위한 AI 외환·무역금융 비서</p>
      <p class="hero-value">거래를 입력하면 <strong>환위험·유동성을 결정론적으로 계산</strong>하고,
        <strong>공개용 합성 자격 규칙</strong>으로 상담 후보를 판정해 <strong>상담 브리프</strong>까지 만들어 드립니다.</p>
      <p class="hint"><strong>포트폴리오 공개본:</strong> 상품명·자격조건·임계값은 실제 금융상품이 아닌 합성 예시입니다.</p>
      <ol class="hero-flow" aria-label="이용 5단계">
        <li><span class="flow-num">1</span> 거래 분석</li>
        <li><span class="flow-num">2</span> 위험 계산</li>
        <li><span class="flow-num">3</span> 자격 판정</li>
        <li><span class="flow-num">4</span> 위기 재검증</li>
        <li><span class="flow-num">5</span> 상담 연결</li>
      </ol>
    </div>
  </header>
  <main id="app"></main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
